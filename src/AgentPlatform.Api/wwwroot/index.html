<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgentPlatform - AI Agent 对话平台</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11/styles/atom-one-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11/highlight.min.js"></script>
</head>
<body>
    <div id="app">
        <!-- 侧边栏 -->
        <aside id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                        <path d="M2 17l10 5 10-5"/>
                        <path d="M2 12l10 5 10-5"/>
                    </svg>
                    <span class="logo-text">AgentPlatform</span>
                </div>
                <button id="new-chat-btn" class="btn-new-chat" title="新建对话">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"/>
                        <line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                    <span>新建对话</span>
                </button>
            </div>

            <div class="sidebar-search">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <input type="text" id="session-search" placeholder="搜索对话..." autocomplete="off">
            </div>

            <div id="session-list" class="session-list">
                <!-- 对话列表动态生成 -->
            </div>

            <div class="sidebar-footer">
                <button id="theme-toggle-btn" class="btn-icon-only" title="切换主题">
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
                        <circle cx="12" cy="12" r="5"/>
                        <line x1="12" y1="1" x2="12" y2="3"/>
                        <line x1="12" y1="21" x2="12" y2="23"/>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                        <line x1="1" y1="12" x2="3" y2="12"/>
                        <line x1="21" y1="12" x2="23" y2="12"/>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                    </svg>
                </button>
                <button id="settings-btn" class="btn-settings" title="设置">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                    </svg>
                    <span>设置</span>
                </button>
            </div>
        </aside>

        <!-- 主聊天区域 -->
        <main id="chat-main">
            <header id="chat-header">
                <button id="sidebar-toggle" class="btn-icon-only mobile-only" title="菜单">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="12" x2="21" y2="12"/>
                        <line x1="3" y1="6" x2="21" y2="6"/>
                        <line x1="3" y1="18" x2="21" y2="18"/>
                    </svg>
                </button>
                <h1 id="current-session-title" class="chat-title">新对话</h1>
                <div class="header-actions">
                    <button id="clear-chat-btn" class="btn-header" title="清空对话记录">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="3 6 5 6 21 6"/>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                        </svg>
                        <span>清空</span>
                    </button>
                </div>
            </header>

            <div id="messages-container" class="messages-container">
                <div id="welcome-screen" class="welcome-screen">
                    <div class="welcome-logo">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                            <path d="M2 17l10 5 10-5"/>
                            <path d="M2 12l10 5 10-5"/>
                        </svg>
                    </div>
                    <h2>欢迎使用 AgentPlatform</h2>
                    <p>AI Agent 智能对话平台，支持工具调用、MCP 服务和技能扩展</p>
                    <div class="welcome-suggestions">
                        <div class="suggestion-card" data-prompt="你好，请介绍一下你自己">
                            <div class="suggestion-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                                </svg>
                            </div>
                            <span>开始对话</span>
                        </div>
                        <div class="suggestion-card" data-prompt="帮我写一个 Python 排序算法">
                            <div class="suggestion-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="16 18 22 12 16 6"/>
                                    <polyline points="8 6 2 12 8 18"/>
                                </svg>
                            </div>
                            <span>代码生成</span>
                        </div>
                        <div class="suggestion-card" data-prompt="查看当前可用的工具列表">
                            <div class="suggestion-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
                                </svg>
                            </div>
                            <span>工具调用</span>
                        </div>
                        <div class="suggestion-card" data-prompt="帮我分析一段文本的情感">
                            <div class="suggestion-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
                                </svg>
                            </div>
                            <span>智能分析</span>
                        </div>
                    </div>
                </div>
                <div id="messages-list" class="messages-list"></div>
            </div>

            <!-- 输入区域 -->
            <div id="input-area" class="input-area">
                <div id="image-preview-container" class="image-preview-container"></div>
                <div class="input-wrapper">
                    <div class="input-actions-left">
                        <button id="image-upload-btn" class="btn-input-icon" title="上传图片">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                                <circle cx="8.5" cy="8.5" r="1.5"/>
                                <polyline points="21 15 16 10 5 21"/>
                            </svg>
                        </button>
                        <input type="file" id="image-input" accept="image/*" multiple style="display:none">
                    </div>
                    <textarea id="message-input" placeholder="输入消息... (Enter 发送, Shift+Enter 换行)" rows="1"></textarea>
                    <div class="input-actions-right">
                        <button id="send-btn" class="btn-send" title="发送消息">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="22" y1="2" x2="11" y2="13"/>
                                <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                            </svg>
                        </button>
                        <button id="stop-btn" class="btn-stop" title="停止生成" style="display:none">
                            <svg viewBox="0 0 24 24" fill="currentColor">
                                <rect x="6" y="6" width="12" height="12" rx="2"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="input-hint">
                    <span id="char-count">0</span> / 32000
                </div>
            </div>
        </main>
    </div>

    <!-- 设置模态框 -->
    <div id="settings-modal" class="modal-overlay" style="display:none">
        <div class="modal">
            <div class="modal-header">
                <h2>设置</h2>
                <button id="close-settings-btn" class="btn-close" title="关闭">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="settings-tabs">
                    <button class="settings-tab active" data-tab="model">模型配置</button>
                    <button class="settings-tab" data-tab="mcp">MCP 服务</button>
                    <button class="settings-tab" data-tab="skills">技能管理</button>
                </div>

                <!-- 模型配置 -->
                <div id="tab-model" class="settings-tab-content active">
                    <div class="form-group">
                        <label for="model-provider">服务商</label>
                        <select id="model-provider">
                            <option value="openai">OpenAI</option>
                            <option value="azure">Azure OpenAI</option>
                            <option value="anthropic">Anthropic</option>
                            <option value="custom">自定义</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="model-base-url">Base URL</label>
                        <input type="text" id="model-base-url" placeholder="https://api.openai.com/v1">
                    </div>
                    <div class="form-group">
                        <label for="model-api-key">API Key</label>
                        <input type="password" id="model-api-key" placeholder="sk-...">
                    </div>
                    <div class="form-group">
                        <label for="model-name">模型名称</label>
                        <input type="text" id="model-name" placeholder="gpt-4o">
                    </div>
                    <div class="form-group">
                        <label for="model-temperature">
                            Temperature: <span id="temperature-value">0.7</span>
                        </label>
                        <input type="range" id="model-temperature" min="0" max="2" step="0.1" value="0.7">
                    </div>
                    <div class="form-group">
                        <label for="model-max-tokens">Max Tokens</label>
                        <input type="number" id="model-max-tokens" min="1" max="128000" value="4096">
                    </div>
                    <div class="form-group">
                        <label for="model-timeout">超时时间 (秒)</label>
                        <input type="number" id="model-timeout" min="10" max="600" value="120">
                    </div>
                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="model-enable-vision">
                            <span>启用视觉 (Vision)</span>
                        </label>
                    </div>
                    <div class="form-group">
                        <label for="system-prompt">系统提示词</label>
                        <textarea id="system-prompt" rows="5" placeholder="你是一个有用的AI助手..."></textarea>
                    </div>
                    <div class="form-actions">
                        <button id="save-model-btn" class="btn-primary">保存配置</button>
                    </div>
                </div>

                <!-- MCP 服务 -->
                <div id="tab-mcp" class="settings-tab-content">
                    <div class="tab-toolbar">
                        <button id="mcp-health-btn" class="btn-secondary">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
                            </svg>
                            健康检查
                        </button>
                        <button id="mcp-refresh-btn" class="btn-secondary">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="23 4 23 10 17 10"/>
                                <polyline points="1 20 1 14 7 14"/>
                                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                            </svg>
                            刷新
                        </button>
                    </div>
                    <div id="mcp-servers-list" class="items-list"></div>

                    <div class="add-item-form">
                        <h3>添加 MCP 服务</h3>
                        <div class="form-group">
                            <label for="mcp-name">名称</label>
                            <input type="text" id="mcp-name" placeholder="my-server">
                        </div>
                        <div class="form-group">
                            <label for="mcp-transport">传输方式</label>
                            <select id="mcp-transport">
                                <option value="stdio">Stdio</option>
                                <option value="sse">SSE</option>
                            </select>
                        </div>
                        <div class="form-group" id="mcp-command-group">
                            <label for="mcp-command">命令</label>
                            <input type="text" id="mcp-command" placeholder="npx">
                        </div>
                        <div class="form-group" id="mcp-args-group">
                            <label for="mcp-args">参数 (空格分隔)</label>
                            <input type="text" id="mcp-args" placeholder="-y @modelcontextprotocol/server-filesystem">
                        </div>
                        <div class="form-group" id="mcp-url-group" style="display:none">
                            <label for="mcp-url">URL</label>
                            <input type="text" id="mcp-url" placeholder="http://localhost:3001/sse">
                        </div>
                        <div class="form-group">
                            <label for="mcp-env">环境变量 (KEY=VALUE, 逗号分隔)</label>
                            <input type="text" id="mcp-env" placeholder="API_KEY=xxx,DEBUG=true">
                        </div>
                        <div class="form-group">
                            <label class="checkbox-label">
                                <input type="checkbox" id="mcp-enabled" checked>
                                <span>启用</span>
                            </label>
                        </div>
                        <div class="form-group">
                            <label class="checkbox-label">
                                <input type="checkbox" id="mcp-autostart" checked>
                                <span>自动启动</span>
                            </label>
                        </div>
                        <div class="form-actions">
                            <button id="add-mcp-btn" class="btn-primary">添加服务</button>
                        </div>
                    </div>
                </div>

                <!-- 技能管理 -->
                <div id="tab-skills" class="settings-tab-content">
                    <div class="tab-toolbar">
                        <button id="skills-reload-btn" class="btn-secondary">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="23 4 23 10 17 10"/>
                                <polyline points="1 20 1 14 7 14"/>
                                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                            </svg>
                            重新加载
                        </button>
                    </div>
                    <div id="skills-list" class="items-list"></div>

                    <div class="add-item-form">
                        <h3>添加技能</h3>
                        <div class="form-group">
                            <label for="skill-name">名称</label>
                            <input type="text" id="skill-name" placeholder="my-skill">
                        </div>
                        <div class="form-group">
                            <label for="skill-description">描述</label>
                            <input type="text" id="skill-description" placeholder="技能描述">
                        </div>
                        <div class="form-group">
                            <label for="skill-type">类型</label>
                            <select id="skill-type">
                                <option value="mcp">MCP 工具</option>
                                <option value="script">脚本</option>
                            </select>
                        </div>
                        <div class="form-group" id="skill-mcp-server-group">
                            <label for="skill-mcp-server">MCP 服务</label>
                            <input type="text" id="skill-mcp-server" placeholder="server-name">
                        </div>
                        <div class="form-group" id="skill-mcp-tool-group">
                            <label for="skill-mcp-tool">MCP 工具</label>
                            <input type="text" id="skill-mcp-tool" placeholder="tool_name">
                        </div>
                        <div class="form-group" id="skill-script-group" style="display:none">
                            <label for="skill-script">脚本路径</label>
                            <input type="text" id="skill-script" placeholder="/path/to/script.py">
                        </div>
                        <div class="form-group">
                            <label class="checkbox-label">
                                <input type="checkbox" id="skill-enabled" checked>
                                <span>启用</span>
                            </label>
                        </div>
                        <div class="form-actions">
                            <button id="add-skill-btn" class="btn-primary">添加技能</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="settings-close-btn" class="btn-secondary">关闭</button>
            </div>
        </div>
    </div>

    <!-- 工具列表模态框 -->
    <div id="tools-modal" class="modal-overlay" style="display:none">
        <div class="modal modal-sm">
            <div class="modal-header">
                <h2 id="tools-modal-title">可用工具</h2>
                <button id="close-tools-btn" class="btn-close" title="关闭">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div id="tools-list" class="tools-list"></div>
            </div>
        </div>
    </div>

    <!-- 通知容器 -->
    <div id="toast-container" class="toast-container"></div>

    <script src="js/app.js"></script>
</body>
</html>
